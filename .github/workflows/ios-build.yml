name: iOS build check

# Compiles the native Nmind app on a Mac, unsigned, to check the code builds.
# No signing, no Apple account, nothing is uploaded or published.
on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Pick the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Get the Metal shader compiler
        run: xcodebuild -downloadComponent MetalToolchain || echo "Metal toolchain already present or not needed"
      - name: Build unsigned for iPhone
        run: |
          set -o pipefail
          xcodebuild -project ios/Nmind.xcodeproj -target Nmind -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
